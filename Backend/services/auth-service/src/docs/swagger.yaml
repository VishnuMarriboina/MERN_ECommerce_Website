openapi: 3.0.0
info:
  title: Auth Service API
  version: 1.0.0
servers:
  - url: http://localhost:3001
paths:
  /api/auth/signup:
    post:
      summary: Register a new user
  /api/auth/login:
    post:
      summary: Login
  /api/auth/refresh-token:
    post:
      summary: Refresh access token
  /api/auth/forgot-password:
    post:
      summary: Reset password
